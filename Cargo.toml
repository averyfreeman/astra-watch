[package]
name = "astra-watch"
version = "0.1.0"
edition = "2024"
description = "Project contracts and current code evidence for the native Codex harness"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
ignore = "0.4"
libc = "0.2"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rmcp = { version = "3.5", default-features = false, features = ["macros", "schemars", "server", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3.23"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tokio-util = "0.7"
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
uuid = { version = "1.26", features = ["v4", "serde"] }
