[astra_watch]
schema_version = 1
prompt_file = ".astra-watch/project_prompt.md"
languages = ["rust"]

[astra_watch.mission]
outcome = "Ongoing improvement and maintenance of Astra Watch as a reliable, native-first Codex plugin for project bootstrap and evidence-bound development."
non_goals = [
  "Replace Codex native execution, permissions, planning, delegation, worktrees, or scheduling.",
  "Add an automatic background model worker or claim unsupported integrations as verified.",
  "Publish, release, deploy, install plugins, or use external services without separate authorization.",
]
constraints = [
  "Keep each delivery slice within its explicit relative write_scope; do not widen it silently.",
  "Preserve user-owned files and existing public plugin/tool contracts unless an accepted task requires a reviewed change.",
  "Review configured verification argv and run checks through the native shell.",
  "Before queueing each slice, define its specific acceptance criteria and bind executable criteria to relevant configured checks; profile changes invalidate existing task contracts.",
  "Review changed behavior and the diff before completion; v0.1 cannot record manual review as passing executable evidence.",
  "Do not perform Git writes, plugin installation, release, publication, deployment, or external service actions without separate user authorization.",
  "Use Git checkpoint controls only from a valid isolated worktree.",
]

[[astra_watch.mission.criteria]]
id = "rust-format"
description = "Rust source passes rustfmt check."
check = "rust-format"

[[astra_watch.mission.criteria]]
id = "rust-lint"
description = "All Rust targets pass Clippy with warnings denied."
check = "rust-lint"

[[astra_watch.mission.criteria]]
id = "rust-tests"
description = "The locked all-target Rust test suite passes."
check = "rust-tests"

[astra_watch.checks.rust-format]
program = "cargo"
args = ["fmt", "--check"]
timeout_secs = 120

[astra_watch.checks.rust-lint]
program = "cargo"
args = ["clippy", "--locked", "--all-targets", "--", "-D", "warnings"]
timeout_secs = 600

[astra_watch.checks.rust-tests]
program = "cargo"
args = ["test", "--locked", "--all-targets"]
timeout_secs = 600

[astra_watch.runtime]
max_slices = 80
max_retries_per_check = 2

[astra_watch.knowledge]
max_files = 10000
max_file_bytes = 2000000
max_chunks = 30000
max_hits = 8

[astra_watch.git]
protected_branches = ["main", "master"]
checkpoint_mode = "verified-slice-proposal"

[astra_watch.docs]
pages_enabled = false
recordings_enabled = false
